name: Deploy

# A push to main goes to https://neonstickfight.com (and the old address, askscottpierce.com/stick-fight):
# typecheck, D1 migrations, then the build and the Worker. README: "Hosting".
#
# Needs, on the repo:
#   variable  CLOUDFLARE_ACCOUNT_ID
#   secret    CLOUDFLARE_API_TOKEN   made by scripts/ci-token.sh (Workers Routes Write on both zones)
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order. A running deploy is never cancelled halfway through
# its migrations.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Only checks that need no dev server or real content; the rest stay a local run.
      - run: npm run typecheck

      - name: Say so if the token isn't set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN secret on this repo. Make one with: CF_TOKEN_MANAGER=... NEW_ZONE_ID=... scripts/ci-token.sh"
            exit 1
          fi

      # Migrate before deploy: the migrations only add tables and columns, so the old Worker
      # runs on top of them, and the new one fails without them.
      - run: npx wrangler d1 migrations apply stick-fight-auth --remote
      - run: npm run deploy
